howRecipe(id){let r=recipes().find(r=>r.id===id);if(!r)return;let m=macros(r);openModal(`${r.photo?`<img class="photo" src="${r.photo}" alt="${esc(r.name)}">`:''}<h2>${esc(r.name)}</h2><span class="tag">${r.type} · ${r.servings} Portion(en)</span><p><b>${Math.round(m.kcal)} kcal</b> · Protein ${Math.round(m.p)} g · KH ${Math.round(m.c)} g · Fett ${Math.round(m.f)} g (gesamtes Rezept)</p><h3>Zutaten</h3>${r.ingredients.map(i=>`<div class="row"><span>${esc(i.name)}</span><b>${n(i.g)} g</b></div>`).join('')}<h3>Zubereitung</h3><p style="white-space:pre-wrap">${esc(r.steps||'Noch keine Anleitung hinterlegt.')}</p><button class="alt" onclick="editRecipe('${id}')">Rezept bearbeiten</button>`)}function editRecipe(id){let r=recipes().find(r=>r.id===id)||{name:'',type:'Frühstück',servings:1,ingredients:[],steps:'',photo:''};openModal(`<h2>${id?'Rezept bearbeiten':'Neues Rezept'}</h2><form class="form" id="recipeForm"><label class="field">Rezeptname<input name="name" required maxlength="100" value="${esc(r.name)}"></label><div class="two"><label class="field">Kategorie<select name="type">${TYPES.map(t=>`<option ${r.type===t?'selected':''}>${t}</option>`).join('')}</select></label><label class="field">Portionen<input name="servings" type="number" min="1" max="30" value="${r.servings}" required></label></div><label class="field">Zutaten: eine pro Zeile, Name | Gramm | kcal/100 g | Protein/100 g | KH/100 g | Fett/100 g<textarea name="ingredients" required>${esc(r.ingredients.map(i=>[i.name,i.g,i.kcal,i.p,i.c,i.f].join(' | ')).join('\n'))}</textarea></label><p class="small muted">Nährwerte pro 100 g bitte vom Produktetikett übernehmen; es gibt noch keine automatische Lebensmitteldatenbank.</p><label class="field">Zubereitung<textarea name="steps">${esc(r.steps)}</textarea></label><label class="field">Rezeptfoto (optional)<input type="file" name="photo" accept="image/*"></label><button>Rezept speichern</button></form>`);$('recipeForm').onsubmit=async e=>{e.preventDefault();let f=new FormData(e.target),ingredients=[];for(let line of String(f.get('ingredients')).split('\n')){if(!line.trim())continue;let a=line.split('|').map(s=>s.trim());if(a.length!==6||!a[0]||a.slice(1).some(v=>v===''||!Number.isFinite(Number(v))||Number(v)<0)){alert('Bitte jede Zutat mit Name und fünf gültigen Zahlen eingeben.');return}ingredients.push({name:a[0],g:num(a[1]),kcal:num(a[2]),p:num(a[3]),c:num(a[4]),f:num(a[5])})}if(!ingredients.length){alert('Mindestens eine Zutat angeben.');return}let photo=r.photo,file=f.get('photo');if(file?.size){if(file.size>4e6){alert('Bitte ein Foto unter 4 MB wählen.');return}photo=await readFile(file)}let x={id:id||uid(),name:String(f.get('name')).trim(),type:f.get('type'),servings:n(f.get('servings')),ingredients,steps:String(f.get('steps')),photo};if(id)Object.assign(r,x);else data.recipes.push(x);save();closeModal();update()}}function readFile(f){return new Promise((resolve,reject)=>{let r=new FileReader;r.onload=()=>resolve(r.result);r.onerror=reject;r.readAsDataURL(f)})}async function uploadMealPhoto(e,date,type){let file=e.target.files?.[0];if(!file)return;if(file.size>2e6){alert('Bitte ein Bild unter 2 MB auswählen.');return}data.photos[person][date+'|'+type]=await readFile(file);save();update()}function moodIcon(v){return (data.moodIcons[person]||[])[v-1]||'🙂'}
function progress(){setTimeout(bindCalendar,0);let mood=data.moods[person][selected],checks=data.checkins[person][selected]||{};return head('Deine Fortschritte 🌱','Dein persönlicher Monatsrückblick – jeder Tag zählt.')+calendar('mood')+`<div class="card"><h3>${fmt(selected)} ${mood?`<span style="font-size:2.5rem;vertical-align:middle">${esc(moodIcon(mood))}</span>`:''}</h3><h3>Wie fühlst du dich heute?</h3><div class="actions">${[1,2,3,4,5].map(i=>`<button class="emoji ${mood===i?'selected':''}" onclick="setMood(${i})" title="Stufe ${i}">${esc(moodIcon(i))}</button>`).join('')}</div><button class="alt" onclick="editMoodIcons()">✎ Eigene Emojis festlegen</button><p class="small muted">Deine fünf Emojis kannst du selbst bestimmen.</p><div class="grid">${[['energy','Wie viel Energie hattest du?'],['stress','Wie stressig war dein Tag?'],['sleep','Wie gut hast du geschlafen?'],['work','Wie war dein Tag auf der Arbeit?'],['motivation','Wie motiviert warst du?']].map(([key,label])=>`<div><label class="field">${label}<select onchange="setCheckin('${key}',this.value)"><option value="">Nicht bewertet</option>${[1,2,3,4,5].map(i=>`<option value="${i}" ${Number(checks[key])===i?'selected':''}>${i} / 5 ${esc(moodIcon(i))}</option>`).join('')}</select></label></div>`).join('')}</div><label class="field">Notiz (freiwillig)<textarea id="moodNote" placeholder="Was möchtest du festhalten?">${esc(data.notes[person][selected]||'')}</textarea></label><button onclick="saveMoodNote()">Notiz speichern</button></div>`}
function setMood(i){data.moods[person][selected]=i;save();update()}
function setCheckin(key,value){data.checkins[person][selected]??={};if(value)data.checkins[person][selected][key]=Number(value);else delete data.checkins[person][selected][key];save()}
function saveMoodNote(){data.notes[person][selected]=$('moodNote').value;save();update()}
function editMoodIcons(){openModal(`<h2>Deine fünf Emojis 🌸</h2><p>Trage pro Stufe ein Emoji ein.</p><form id="emojiForm" class="form">${data.moodIcons[person].map((v,i)=>`<label class="field">Stufe ${i+1}<input name="e${i}" value="${esc(v)}" maxlength="12" required></label>`).join('')}<button>Emojis speichern</button></form>`);$('emojiForm').onsubmit=e=>{e.preventDefault();let f=new FormData(e.target);data.moodIcons[person]=[0,1,2,3,4].map(i=>String(f.get('e'+i)).trim()||'🙂');save();closeModal();update()}}
function settings(){let s=data.settings[person];return head('Mein Bereich ⚙','Deine Angaben und deine persönliche Bloom-Einstellung.')+`<div class="card"><form id="settingsForm" class="form"><label class="field">Anzeigename<input name="name" value="${esc(data.names[person])}" maxlength="50" required></label><label class="field">Akzentfarbe<input name="color" type="color" value="${esc(data.colors[person])}"></label><div class="grid"><label class="field">Größe (cm)<input name="height" type="number" min="0" max="250" step="0.1" value="${esc(s.height??'')}"></label><label class="field">Gewicht (kg) – freiwillig<input name="weight" type="number" min="0" max="500" step="0.1" value="${esc(s.weight??'')}"></label><label class="field">Kalorienziel (kcal)<input name="calories" type="number" min="0" max="10000" step="1" value="${esc(s.calories??'')}"></label><label class="field">Proteinziel (g)<input name="protein" type="number" min="0" max="1000" step="1" value="${esc(s.protein??'')}"></label></div><label class="field">Ernährungsweise / Vorlieben<textarea name="preferences">${esc(s.preferences??'')}</textarea></label><label class="field">Unverträglichkeiten<textarea name="intolerances">${esc(s.intolerances??'')}</textarea></label><button>Änderungen speichern</button></form><p class="small muted">Diese Version speichert Angaben nur lokal auf diesem Gerät. Die Profilauswahl ist noch keine geschützte Anmeldung. Bitte keine sensiblen Gesundheitsdaten eingeben, bevor die sichere Speicherung umgesetzt ist.</p></div>`}
function bindSettings(){let form=$('settingsForm');if(!form)return;form.onsubmit=e=>{e.preventDefault();let f=new FormData(form),name=String(f.get('name')).trim();if(!name)return;data.names[person]=name;data.colors[person]=String(f.get('color'));for(const k of ['height','weight','calories','protein']){let v=String(f.get(k)).trim();data.settings[person][k]=v===''?'':Math.max(0,Number(v)||0)}for(const k of ['preferences','intolerances'])data.settings[person][k]=String(f.get(k));save();update()}}
function week(){let start=plus(selected,-weekday(selected));return head('Dein Wochenplan 📅','Die kompakte Vorschau für Ernährung und Training.')+`<div class="card"><div class="actions"><button class="alt" onclick="selected=plus(selected,-7);month=monthStart(selected);update()">‹ Vorwoche</button><button class="alt" onclick="selected=plus(selected,7);month=monthStart(selected);update()">Nächste Woche ›</button></div>${Array.from({length:7},(_,i)=>{let d=plus(start,i),p=plansFor(d),w=person==='me'?dayStrength(d)?.label||'Ruhetag':data.workoutTemplates.find(x=>x.id===data.workoutSchedule.sister[d])?.name||'Ruhetag';return `<div class="row"><div><b>${DAYS[i]} · ${d.slice(8)}.${d.slice(5,7)}.</b><div class="small muted">${TYPES.map(t=>{let r=recipes().find(r=>r.id===p[t]?.recipe);return r?`${t}: ${r.name}`:''}).filter(Boolean).map(esc).join(' · ')||'Keine Mahlzeiten geplant'}</div><div class="tag">${esc(w)}</div></div><button class="alt" onclick="selected='${d}';month=monthStart(selected);go('food')">Öffnen</button></div>`}).join('')}</div>`}function dayStrength(date){let p=data.strengthPlans.find(p=>p.id===data.activePlan);return p?.days[weekday(date)]}function strength(){let p=data.strengthPlans.find(p=>p.id===data.activePlan);setTimeout(bindCalendar,0);return head('Dein Krafttrainingstagebuch 🌸','Dein Wochenplan wiederholt sich automatisch. Gewichte und Wiederholungen erfasst du erst beim Training.')+`<div class="card"><div class="row"><h3>Meine Trainingspläne</h3><button onclick="newStrengthPlan()">+ Neuer Plan</button></div>${data.strengthPlans.map(x=>`<div class="row"><div><b>${esc(x.name)}</b> ${x.id===data.activePlan?'<span class="tag">Aktiv</span>':''}</div><div class="actions"><button class="alt" onclick="data.activePlan='${x.id}';save();update()">Auswählen</button><button class="alt" onclick="renameStrengthPlan('${x.id}')">✎</button><button class="alt" onclick="duplicateStrengthPlan('${x.id}')">⧉</button></div></div>`).join('')||'<p class="muted">Lege zuerst einen Trainingsplan an.</p>'}</div>${p?`<div class="card"><h3>${esc(p.name)} · Fester Wochenplan</h3>${p.days.map((d,i)=>`<div class="row"><div><b>${DAYS[i]}</b> · <span class="tag">${esc(d.label||'Ruhetag')}</span><div class="small muted">${d.exercises.map(x=>esc(x.name)).join(' · ')||'Keine Übungen'}</div></div><button class="alt" onclick="editStrengthDay(${i})">Bearbeiten</button></div>`).join('')}</div>`:''}`+calendar('workout')+`<div class="card"><h3>${fmt(selected)} · ${esc(dayStrength(selected)?.label||'Ruhetag')}</h3>${dayStrength(selected)?.exercises.length?`<p>${dayStrength(selected).exercises.map(x=>esc(x.name)).join(' · ')}</p><button onclick="startTraining()">${data.strengthLogs.some(x=>x.date===selected)?'Training erneut erfassen':'Training öffnen'} →</button>`:'<p class="muted">Für diesen Tag ist kein Training hinterlegt.</p>'}${strengthDayTable(selected)}</div><div class="card"><h3>Monatsrückblick</h3>${strengthReview()}</div>`}function strengthDayTable(date){let rows=data.strengthLogs.filter(x=>x.date===date);if(!rows.length)return '<p class="small muted">Für diesen Tag ist noch kein Training abgeschlossen.</p>';return `<h3>✓ Abgeschlossenes Training · ${fmt(date)}</h3><div style="overflow-x:auto"><table class="history-table"><thead><tr><th>Übung</th><th>Satz</th><th>kg</th><th>Wdh.</th></tr></thead><tbody>${rows.map(x=>x.sets.map((s,i)=>`<tr><td>${esc(x.exercise)}</td><td>${i+1}</td><td>${esc(s.kg)}</td><td>${esc(s.reps)}</td></tr>`).join('')).join('')}</tbody></table></div>`}
function newStrengthPlan(){let name=prompt('Name deines Trainingsplans','Mein Trainingsplan');if(!name?.trim())return;let x={id:uid(),name:name.trim(),days:DAYS.map(()=>({label:'Ruhetag',exercises:[]}))};data.strengthPlans.push(x);data.activePlan=x.id;save();update()}function renameStrengthPlan(id){let p=data.strengthPlans.find(x=>x.id===id),v=prompt('Planname',p.name);if(v?.trim()){p.name=v.trim();save();update()}}function duplicateStrengthPlan(id){let p=data.strengthPlans.find(x=>x.id===id);data.strengthPlans.push({...JSON.parse(JSON.stringify(p)),id:uid(),name:p.name+' (Kopie)'});data.activePlan=data.strengthPlans.at(-1).id;save();update()}function editStrengthDay(i){let d=dayStrength(plus('2026-11-02',i)),p=data.strengthPlans.find(x=>x.id===data.activePlan);d=p.days[i];openModal(`<h3>${DAYS[i]} bearbeiten</h3><form class="form" id="strengthDayForm"><label class="field">Kürzel (z. B. Push, Pull, Legs, Restday)<input name="label" maxlength="20" value="${esc(d.label)}" required></label><label class="field">Übungen, eine pro Zeile<textarea name="exercises">${esc(d.exercises.map(x=>x.name).join('\n'))}</textarea></label><p class="small muted">Sätze, Gewichte und Wiederholungen kommen erst beim Training.</p><button>Wochenplan speichern</button></form>`);$('strengthDayForm').onsubmit=e=>{e.preventDefault();let f=new FormData(e.target),names=String(f.get('exercises')).split('\n').map(x=>x.trim()).filter(Boolean);d.label=String(f.get('label')).trim();d.exercises=names.map((name,j)=>({id:d.exercises.find(x=>x.name===name)?.id||uid(),name}));save();closeModal();update()}}function startTraining(){let d=dayStrength(selected);if(!d?.exercises.length)return;session={date:selected,planId:data.activePlan,label:d.label,exercises:d.exercises.map(x=>({...x})),entries:{}};step=0;showStep()}function showStep(){let ex=session.exercises[step],old=[...data.strengthLogs].reverse().find(l=>l.exercise===ex.name),entry=session.entries[ex.id]||old?.sets||[{kg:'',reps:''},{kg:'',reps:''},{kg:'',reps:''}];openModal(`<div class="training-progress">${step+1} von ${session.exercises.length} Übungen · ${fmt(session.date)}</div><h2>${esc(ex.name)}</h2>${old?`<p class="small muted">Letztes Mal: ${old.sets.map(s=>s.kg+' kg × '+s.reps).join(' · ')}</p>`:''}<form class="form" id="trainingStep"><div class="three">${entry.map((s,i)=>`<div class="field"><b>Satz ${i+1}</b><label>Gewicht (kg)<input type="number" min="0" max="1000" step="0.5" name="kg${i}" value="${s.kg}" required></label><label>Wiederholungen<input type="number" min="0" max="1000" step="1" name="reps${i}" value="${s.reps}" required></label></div>`).join('')}</div><button>${step===session.exercises.length-1?'Training abschließen ✓':'Nächste Übung →'}</button></form>`);$('trainingStep').onsubmit=e=>{e.preventDefault();let f=new FormData(e.target),sets=[0,1,2].map(i=>({kg:num(f.get('kg'+i)),reps:num(f.get('reps'+i))}));if(sets.some(s=>s.kg<0||s.kg>1000||!Number.isInteger(s.reps)||s.reps<0||s.reps>1000)){alert('Bitte gültige Werte eingeben.');return}session.entries[ex.id]=sets;if(step<session.exercises.length-1){step++;showStep()}else{data.strengthLogs=data.strengthLogs.filter(l=>!(l.date===session.date&&l.planId===session.planId));for(let x of session.exercises){data.strengthLogs.push({id:uid(),date:session.date,planId:session.planId,label:session.label,exercise:x.name,sets:session.entries[x.id]})}save();session=null;closeModal();update()}}}function strengthReview(){let list=data.strengthLogs.filter(x=>x.date.slice(0,7)===month.slice(0,7)),names=[...new Set(list.map(x=>x.exercise))];return `<p class="muted">${list.length} protokollierte Übungen im ${new Date(month+'T12:00:00').toLocaleDateString('de-DE',{month:'long',year:'numeric'})}</p>${names.map(name=>{let rows=list.filter(x=>x.exercise===name),prev=data.strengthLogs.filter(x=>x.exercise===name&&x.date<month),best=a=>a.length?Math.max(...a.flatMap(x=>x.sets.map(s=>s.kg))):null,a=best(prev),b=best(rows);return `<div class="row"><b>${esc(name)}</b><span>${b} kg Bestwert ${a===null?'· erster Vergleichsmonat':`· vorher ${a} kg (${b>a?'+':''}${b-a} kg)`}</span></div>`}).join('')||'<p class="muted">Noch keine Einträge für diesen Monat.</p>'}`}function workouts(){setTimeout(bindCalendar,0);let id=data.workoutSchedule.sister[selected],w=data.workoutTemplates.find(x=>x.id===id);return head('Deine Workouts ✦','Plane Training und Ruhetage im Monatskalender. Du kannst Termine jederzeit verschieben.')+calendar('workout')+`<div class="card"><h3>${fmt(selected)}</h3><label class="field">Geplantes Workout<select id="workoutPick"><option value="">Ruhetag</option>${data.workoutTemplates.map(x=>`<option value="${x.id}" ${id===x.id?'selected':''}>${esc(x.name)}</option>`).join('')}</select></label><div class="actions" style="margin-top:10px"><button onclick="saveWorkoutPick()">Plan speichern</button>${w?`<button class="alt" onclick="data.workoutDone.sister['${selected}']=!data.workoutDone.sister['${selected}'];save();update()">${data.workoutDone.sister[selected]?'✓ Abgeschlossen':'Als erledigt markieren'}</button>`:''}</div></div><h2>Trainingsbibliothek</h2><div class="grid">${data.workoutTemplates.map(x=>`<div class="card"><span class="tag">${esc(x.category)} · ${x.minutes} Min.</span><h3 style="margin-top:10px">${esc(x.name)}</h3>${x.url?`<a href="${esc(x.url)}" target="_blank" rel="noopener noreferrer">▶ Video öffnen</a>`:'<p class="small muted">Video wird noch ergänzt.</p>'}</div>`).join('')}</div>`}function saveWorkoutPick(){let v=$('workoutPick').value;if(v)data.workoutSchedule.sister[selected]=v;else delete data.workoutSchedule.sister[selected];save();update()}function coach(){return head('Coach-Studio ⚙','Rezepte und Trainingsvideos verwalten. Persönliche Körperdaten deiner Schwester werden hier nicht angezeigt.')+`<div class="card"><h3>Profilnamen & Farben</h3><form class="form" id="names"><label>Dein Name<input name="me" value="${esc(data.names.me)}"></label><label>Name deiner Schwester<input name="sister" value="${esc(data.names.sister)}"></label><div class="two"><label>Deine Akzentfarbe<input type="color" name="meColor" value="${data.colors.me}"></label><label>Farbe deiner Schwester<input type="color" name="sisterColor" value="${data.colors.sister}"></label></div><button>Speichern</button></form></div><div class="card"><h3>Trainingsvideos verwalten</h3><button onclick="editVideo()">+ Video hinzufügen</button>${data.workoutTemplates.map(x=>`<div class="row"><span>${esc(x.name)} · ${esc(x.category)}</span><button class="alt" onclick="editVideo('${x.id}')">Bearbeiten</button></div>`).join('')}</div><div class="card"><h3>Begleitung deiner Schwester</h3><p class="small muted">Hier siehst du ausschließlich dokumentierte Mahlzeiten und erledigte Workouts – keine privaten Fortschrittsnotizen oder Fotos.</p>${Array.from({length:7},(_,i)=>{let d=plus(today,-i),a=Object.values(logsFor(d,'sister')).length;return `<div class="row"><b>${d}</b><span>${a} Mahlzeiten erfasst · Training ${data.workoutDone.sister[d]?'erledigt':'nicht als erledigt markiert'}</span></div>`}).join('')}</div>`}function editVideo(id){let x=data.workoutTemplates.find(x=>x.id===id)||{name:'',category:'Einsteiger',minutes:20,url:''};openModal(`<h3>Workout-Video</h3><form class="form" id="videoForm"><label>Name<input name="name" required value="${esc(x.name)}"></label><label>Kategorie<input name="category" required value="${esc(x.category)}"></label><label>Dauer (Minuten)<input name="minutes" type="number" min="1" max="300" value="${x.minutes}" required></label><label>Video-Link (https://...)<input name="url" type="url" value="${esc(x.url)}"></label><button>Speichern</button></form>`);$('videoForm').onsubmit=e=>{e.preventDefault();let f=new FormData(e.target),v={id:id||uid(),name:f.get('name'),category:f.get('category'),minutes:num(f.get('minutes')),url:f.get('url')};if(id)Object.assign(x,v);else data.workoutTemplates.push(v);save();closeModal();update()}}function openModal(body){$('dialog').innerHTML=`<div class="overlay" id="overlay"><div class="modal" role="dialog" aria-modal="true"><div class="modalhead"><span class="small muted">bloom.</span><button class="alt" onclick="closeModal()" aria-label="Schließen">✕</button></div>${body}</div></div>`;$('overlay').onclick=e=>{if(e.target.id==='overlay')closeModal()}}function closeModal(){$('dialog').innerHTML=''}document.addEventListener('change',e=>{if(e.target.id==='moodDate'){selected=e.target.value;update()}});document.addEventListener('submit',e=>{if(e.target.id==='names'){e.preventDefault();let f=new FormData(e.target);for(let p of ['me','sister'])data.names[p]=String(f.get(p)).trim()||data.names[p];data.colors.me=f.get('meColor');data.colors.sister=f.get('sisterColor');save();update()}});update();
</script></body></html>
